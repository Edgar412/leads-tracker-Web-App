<html>
    <head>
        <meta charset="UTF-8">
        <Title>Login - Leads Tracker</Title>
    </head>
    <body>
        <h2 id="auth-title" style="color: #5f9341" style="font-weight: 900";>Login to Leads Tracker</h2>
        <form id="login-form">
            <input type="email" id="email" placeholder="email@gmail.com" required><br><br>
            <input type="password" id="password" placeholder="password" required><br><br>
            <button type="submit" id="submit-btn">Log In</button>
            <p style="font-size:12px; margin-top:15px;">
                🔒 Secured by Firebase. Please use a unique password for this application.
            </p>
        </form>
        <p id="error-msg" style="color: red;"></p>

        <p class="toggle-text">
            <span id="toggle-prompt">Don't have an account?</span>
            <a href="#" id="toggle-auth-btn">Sign Up</a>
        </p>
        <script type="module" src="login.js"></script>
    </body>
</html>
